# Fly.io configuration for the background worker.
#   fly launch --no-deploy --copy-config --config deploy/worker/fly.toml --dockerfile deploy/worker/Dockerfile
#   fly secrets set --config deploy/worker/fly.toml SUPABASE_SERVICE_ROLE_KEY=... (see docs/DEPLOYMENT.md)
#   fly deploy --config deploy/worker/fly.toml --dockerfile deploy/worker/Dockerfile
# Run from the repository root.

app = "dpd-franchise-worker" # must be unique on Fly.io: change it
primary_region = "lhr"       # London

[env]
  SERVICE_NAME = "worker"
  PORT = "8080"
  LOG_LEVEL = "info"
  NEXT_PUBLIC_SUPABASE_URL = "" # set to your production Supabase URL

[http_service]
  internal_port = 8080
  force_https = true
  # The worker runs its own scheduler timer, so it must never be stopped to save money.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  # Chromium needs memory: 1 GB is the practical minimum.
  size = "shared-cpu-1x"
  memory = "1gb"
