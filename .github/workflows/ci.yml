name: CI

on:
  push:
    branches: [main, ops-qa, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Throw-away values for the disposable CI database only. Nothing here is a real secret.
  CI_ENCRYPTION_KEY: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  database:
    name: Database and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies every migration)
        run: supabase start
      - name: Write .env.local for the tests
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "ENCRYPTION_KEY=$CI_ENCRYPTION_KEY"
          } > .env.local
      - name: Database tests
        run: npm run test:db
      - name: Integration tests
        run: npm run test:integration
      - name: Show database logs if something failed
        if: failure()
        run: docker ps --format '{{.Names}}' | grep -E 'supabase_db|supabase_auth' | xargs -r -I{} sh -c 'echo "--- {}"; docker logs --tail 80 {}'

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Write .env.local
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "ENCRYPTION_KEY=$CI_ENCRYPTION_KEY"
            echo "APP_URL=http://127.0.0.1:3000"
            echo "LOG_LEVEL=warn"
          } > .env.local
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Build the app
        run: npm run build
      - name: Run end-to-end tests
        run: npm run test:e2e -- --trace off
      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Keep responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  worker-image:
    name: Worker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The worker's source lives on the application branch; skip until it exists.
    steps:
      - uses: actions/checkout@v4
      - name: Check the worker entry point exists
        id: worker
        run: |
          if [ -f worker/index.ts ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::worker/index.ts is not on this branch yet, so the image build was skipped."; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.worker.outputs.present == 'true'
      - uses: docker/build-push-action@v6
        if: steps.worker.outputs.present == 'true'
        with:
          context: .
          file: deploy/worker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
