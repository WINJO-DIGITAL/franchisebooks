# Render blueprint for the background worker (alternative to Fly.io / Railway).
# Secrets are marked "sync: false": Render asks for them in its dashboard, so they are never stored in Git.
services:
  - type: web
    name: dpd-franchise-worker
    runtime: docker
    dockerfilePath: ./deploy/worker/Dockerfile
    dockerContext: .
    region: frankfurt # closest to the UK on Render; change if you prefer
    plan: starter     # Chromium needs at least 1 GB of memory
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - { key: SERVICE_NAME, value: worker }
      - { key: LOG_LEVEL, value: info }
      - { key: NEXT_PUBLIC_SUPABASE_URL, sync: false }
      - { key: NEXT_PUBLIC_SUPABASE_ANON_KEY, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: ENCRYPTION_KEY, sync: false }
      - { key: WORKER_AUTH_TOKEN, sync: false }
      - { key: DPD_PORTAL_URL, sync: false }
      - { key: DPD_USERNAME, sync: false }
      - { key: DPD_PASSWORD, sync: false }
      - { key: DPD_LOGIN_SECRET, sync: false }
      - { key: ERROR_WEBHOOK_URL, sync: false }
